# LabLink Configuration: Use Case 1 - IP-Only (No DNS, No SSL)
# Simplest deployment: Access allocator via public IP address over HTTP
#
# ✅ NO RATE LIMITS - Perfect for frequent testing and development
# No DNS or SSL means no certificate issuance limits
#
# Use this when:
# - You don't have a domain name
# - You want fastest setup for testing
# - SSL/HTTPS is not required
# - Testing infrastructure changes frequently
# - Avoiding Let's Encrypt rate limits
#
# Prerequisites:
# - None (no domain or DNS required)
#
# Setup:
# 1. Run setup script: ./scripts/setup-aws-infrastructure.sh
# 2. Deploy infrastructure
# 3. Note allocator IP from Terraform output
#
# Access URL: http://<ALLOCATOR_IP>:5000 (IP will be output after deployment)

# Deployment identity (resource naming: {deployment_name}-{resource}-{environment})
# The deploy workflow overwrites both from its deployment_name/environment inputs.
# Keep deployment_name in sync with the -var="deployment_name=..." you pass to
# Terraform: the allocator scopes its client Terraform state to
# {deployment_name}/{environment}/ in S3, and its IAM policy grants only that prefix.
deployment_name: "my-lablink"
environment: "prod"

db:
  dbname: "lablink_db"
  user: "lablink"
  password: "PLACEHOLDER_DB_PASSWORD"
  host: "localhost"
  port: 5432
  table_name: "vms"

machine:
  machine_type: "g4dn.xlarge"
  image: "ghcr.io/talmolab/lablink-client-base-image:linux-amd64-latest-test"
  ami_id: "ami-0601752c11b394251"  # us-west-2
  repository: "https://github.com/talmolab/sleap-tutorial-data.git"
  software: "sleap"

allocator:
  image_tag: "linux-amd64-latest-test"

app:
  admin_user: "admin"
  admin_password: "PLACEHOLDER_ADMIN_PASSWORD"
  region: "us-west-2"

dns:
  enabled: false  # No DNS - use IP address only
  terraform_managed: false
  domain: ""
  zone_id: ""

eip:
  # EIP name is derived from deployment_name: {deployment_name}-eip-{environment}
  strategy: "dynamic"  # Create new EIP each deployment

ssl:
  provider: "none"  # No SSL - HTTP only
  email: ""
  certificate_arn: ""

startup_script:
  enabled: false
  path: "config/custom-startup.sh"
  on_error: "continue"

bucket_name: "tf-state-lablink-YOURORG"
